<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L-CHAIR Annotation Tool</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- User Selection Modal -->
    <div id="user-modal" class="modal-overlay active" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:9999; display:flex; justify-content:center; align-items:center;">
        <div class="modal-content glass-panel" style="padding:2rem; text-align:center; max-width:400px;">
            <h2 style="margin-bottom:1rem;">Select Annotator</h2>
            <p style="margin-bottom:2rem; color:#aaa;">Who is performing this evaluation?</p>
            <div style="display:flex; gap:1rem; justify-content:center;">
                <button class="win-btn baseline-btn" onclick="selectUser('Annotator 1')">Annotator 1</button>
                <button class="win-btn mop-btn" onclick="selectUser('Annotator 2')">Annotator 2</button>
            </div>
        </div>
    </div>

    <div class="app-container">
        <header class="glass-header">
            <h1>L-CHAIR Evaluation Tool</h1>
            <div class="progress-container">
                <div>
                    <span id="progress-text">Loading...</span>
                    <span id="current-user-badge" style="margin-left:15px; font-weight:bold; color:#a78bfa; background:rgba(167,139,250,0.1); padding:4px 8px; border-radius:4px;"></span>
                </div>
                <div class="progress-bar">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
            </div>
        </header>

        <main class="main-content" id="main-content">
            <!-- Loading State -->
            <div id="loading-state" class="state-panel active">
                <div class="spinner"></div>
                <p>Loading next task...</p>
            </div>

            <!-- Complete State -->
            <div id="complete-state" class="state-panel">
                <div class="success-icon">✓</div>
                <h2>All tasks complete!</h2>
                <p>Thank you for your annotation.</p>
            </div>

            <!-- Annotation Task -->
            <div id="annotation-task" class="task-grid">
                <div class="image-panel glass-panel">
                    <div class="image-container">
                        <img id="task-image" src="" alt="Retail Image">
                    </div>
                </div>

                <div class="controls-panel">
                    <div class="caption-card baseline glass-panel">
                        <div class="card-header">
                            <h3>Model A Caption</h3>
                        </div>
                        <p id="model-a-text" class="caption-text"></p>
                        <button class="win-btn baseline-btn" onclick="submitAnnotation('A')">Model A Wins</button>
                    </div>

                    <div class="caption-card mop glass-panel">
                        <div class="card-header">
                            <h3>Model B Caption</h3>
                        </div>
                        <p id="model-b-text" class="caption-text"></p>
                        <button class="win-btn mop-btn" onclick="submitAnnotation('B')">Model B Wins</button>
                    </div>

                    <div class="action-footer glass-panel">
                        <textarea id="annotation-notes" placeholder="Optional notes..."></textarea>
                        <button class="win-btn tie-btn" onclick="submitAnnotation('tie')">Tie (Equal Quality)</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
